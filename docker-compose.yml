services:
  # ---------- Production: build the static site and serve it via nginx ----------
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: skylogsio/docs:latest
    container_name: skylogs-docs
    ports:
      - "8080:80"          # change the left side to whatever host port you want
    restart: unless-stopped

  # ---------- Development: live-reload authoring mode ----------
  # Start with:  docker compose --profile dev up docs-dev
  # Edit files on the host; the site hot-reloads at http://localhost:3000
  # Draft pages (draft: true) ARE visible in this mode, unlike production.
  docs-dev:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: skylogs-docs-dev
    working_dir: /app
    volumes:
      - .:/app
      - docs_node_modules:/app/node_modules   # keep node_modules in a volume, not the host
    command: sh -c "if [ -f package-lock.json ]; then npm ci; else npm install; fi && npm run start -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true   # reliable file-watching across Docker filesystems

volumes:
  docs_node_modules:
