server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long cache for content-hashed assets emitted by Docusaurus
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML pages: no long cache, so deploys show up immediately
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Legacy URL from the main repo README
    location = /installation { return 301 /quick-start; }

    # Docusaurus generates its own 404 page
    error_page 404 /404.html;

    # Basic hardening headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
